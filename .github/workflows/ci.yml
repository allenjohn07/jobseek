# Runs the same checks as the pre-commit hook (`bun run test`) plus the pre-push build.
# The `test` job is a required status check on main: PRs auto-merge only when it passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0" # git hooks aren't needed in CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd web

      - name: Test (gofmt, go vet, go test, svelte-check, vitest)
        run: bun run test

      - name: Build (frontend + Go binary)
        run: bun run build
